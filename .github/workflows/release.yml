name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Type check
        run: npm run build:types

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # =========================================================================
      # Firefox Build
      # =========================================================================
      - name: Build Firefox extension
        run: npm run build:prod:firefox

      - name: Verify Firefox manifest
        run: |
          if ! grep -q '"scripts"' extension/manifest.json; then
            echo "::error::Firefox manifest not applied (missing background.scripts)"
            exit 1
          fi
          echo "✓ Firefox manifest verified"

      - name: Create Firefox extension zip
        run: |
          cd extension
          zip -r ../light-session-${{ steps.version.outputs.VERSION }}-firefox.zip \
            manifest.json \
            dist/ \
            popup/ \
            icons/ \
            -x "*.map"

      # =========================================================================
      # Chrome Build
      # =========================================================================
      - name: Build Chrome extension
        run: npm run build:prod:chrome

      - name: Verify Chrome manifest
        run: |
          if ! grep -q '"service_worker"' extension/manifest.json; then
            echo "::error::Chrome manifest not applied (missing background.service_worker)"
            exit 1
          fi
          if grep -q 'browser_specific_settings' extension/manifest.json; then
            echo "::error::Chrome manifest contains Firefox-specific settings"
            exit 1
          fi
          echo "✓ Chrome manifest verified"

      - name: Create Chrome extension zip
        run: |
          cd extension
          zip -r ../light-session-${{ steps.version.outputs.VERSION }}-chrome.zip \
            manifest.json \
            dist/ \
            popup/ \
            icons/ \
            -x "*.map"

      # =========================================================================
      # Source Archive
      # =========================================================================
      - name: Create source zip
        run: |
          zip -r light-session-${{ steps.version.outputs.VERSION }}-source.zip \
            package.json \
            package-lock.json \
            tsconfig.json \
            vitest.config.ts \
            eslint.config.js \
            build.cjs \
            README.md \
            AMO-SOURCE-README.md \
            LICENSE \
            .gitignore \
            .prettierrc \
            .node-version \
            docs/ \
            extension/src/ \
            extension/icons/ \
            extension/manifest.firefox.json \
            extension/manifest.chrome.json \
            tests/

      # =========================================================================
      # GitHub Release
      # =========================================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            light-session-${{ steps.version.outputs.VERSION }}-firefox.zip
            light-session-${{ steps.version.outputs.VERSION }}-chrome.zip
            light-session-${{ steps.version.outputs.VERSION }}-source.zip
          body: |
            ## LightSession v${{ steps.version.outputs.VERSION }}

            ### Installation

            **Firefox Add-ons (recommended):**
            [Install from AMO](https://addons.mozilla.org/en-US/firefox/addon/lightsession-for-chatgpt/)

            **Chrome Web Store:**
            [Install from Chrome Web Store](https://chrome.google.com/webstore/detail/lightsession-for-chatgpt/${{ secrets.CHROME_EXTENSION_ID }})

            **Manual install (Firefox):**
            1. Download `light-session-${{ steps.version.outputs.VERSION }}-firefox.zip`
            2. Open `about:debugging#/runtime/this-firefox` in Firefox
            3. Click "Load Temporary Add-on"
            4. Select the downloaded zip file

            **Manual install (Chrome):**
            1. Download `light-session-${{ steps.version.outputs.VERSION }}-chrome.zip`
            2. Open `chrome://extensions` in Chrome
            3. Enable "Developer mode"
            4. Click "Load unpacked" and select the extracted folder

            ---

      # =========================================================================
      # Firefox Add-ons Publishing
      # =========================================================================
      - name: Publish to Firefox Add-ons
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          WEB_EXT_API_KEY: ${{ secrets.FIREFOX_API_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.FIREFOX_API_SECRET }}
          APPROVAL_NOTES: |
            Source archive for this exact version is attached.

            Build environment:
            - Node.js 24.x (see .node-version)
            - npm ci (uses package-lock.json)

            Build steps:
            1. npm ci
            2. npm run build:prod:firefox

            The submitted zip was created with:
            cd extension && zip -r ../light-session-VERSION-firefox.zip manifest.json dist/ popup/ icons/ -x "*.map"

            See AMO-SOURCE-README.md in the source archive for details.
        run: |
          set -euo pipefail

          # Skip if this version was already submitted (e.g. re-running a failed job)
          JWT=$(node -e '
            const c = require("crypto");
            const b64 = (o) => Buffer.from(JSON.stringify(o)).toString("base64url");
            const now = Math.floor(Date.now() / 1000);
            const data = b64({ alg: "HS256", typ: "JWT" }) + "." +
              b64({ iss: process.env.WEB_EXT_API_KEY, jti: c.randomUUID(), iat: now, exp: now + 60 });
            const sig = c.createHmac("sha256", process.env.WEB_EXT_API_SECRET).update(data).digest("base64url");
            console.log(data + "." + sig);
          ')
          echo "::add-mask::$JWT"
          ADDON_ID=$(jq -er .browser_specific_settings.gecko.id extension/manifest.firefox.json)
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: JWT $JWT" \
            "https://addons.mozilla.org/api/v5/addons/addon/${ADDON_ID}/versions/v${VERSION}/")
          case "$STATUS" in
            200) echo "Version ${VERSION} already exists on AMO, skipping"; exit 0 ;;
            404) ;;
            *) echo "::error::AMO version lookup failed: HTTP $STATUS"; exit 1 ;;
          esac

          # Sign from the exact files in the Firefox zip (extension/ now holds the Chrome build)
          mkdir -p amo-upload
          unzip -q "light-session-${VERSION}-firefox.zip" -d amo-upload

          jq -n \
            --arg notes "$APPROVAL_NOTES" \
            --arg release "See release notes at https://github.com/11me/light-session/releases/tag/v${VERSION}" \
            '{version: {license: "MIT", approval_notes: $notes, release_notes: {"en-US": $release}}}' \
            > amo-metadata.json

          # Add-on ID comes from browser_specific_settings.gecko.id in the manifest
          npx web-ext sign \
            --source-dir amo-upload \
            --channel listed \
            --amo-metadata amo-metadata.json \
            --upload-source-code "light-session-${VERSION}-source.zip" \
            --approval-timeout 0

      # =========================================================================
      # Chrome Web Store Publishing (API v2)
      # =========================================================================
      - name: Publish to Chrome Web Store
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          ITEM="publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}"
          API=https://chromewebstore.googleapis.com

          ACCESS_TOKEN=$(curl -sS --fail-with-body https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" \
            -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" \
            -d grant_type=refresh_token | jq -er .access_token)
          echo "::add-mask::$ACCESS_TOKEN"
          AUTH=(-H "Authorization: Bearer $ACCESS_TOKEN")

          RESPONSE=$(curl -sS --fail-with-body "${AUTH[@]}" -X POST \
            -T "light-session-${VERSION}-chrome.zip" \
            "$API/upload/v2/${ITEM}:upload")
          echo "$RESPONSE"
          STATE=$(jq -r .uploadState <<< "$RESPONSE")

          for _ in $(seq 1 30); do
            [ "$STATE" != "IN_PROGRESS" ] && break
            sleep 10
            RESPONSE=$(curl -sS --fail-with-body "${AUTH[@]}" "$API/v2/${ITEM}:fetchStatus")
            echo "$RESPONSE"
            STATE=$(jq -r .lastAsyncUploadState <<< "$RESPONSE")
          done
          if [ "$STATE" != "SUCCEEDED" ]; then
            echo "::error::Chrome Web Store upload failed: $STATE"
            exit 1
          fi

          RESPONSE=$(curl -sS --fail-with-body "${AUTH[@]}" -X POST \
            -H "Content-Type: application/json" -d '{}' \
            "$API/v2/${ITEM}:publish")
          echo "$RESPONSE"
          case "$(jq -r .state <<< "$RESPONSE")" in
            PENDING_REVIEW|STAGED|PUBLISHED|PUBLISHED_TO_TESTERS) ;;
            *) echo "::error::Chrome Web Store publish failed"; exit 1 ;;
          esac
